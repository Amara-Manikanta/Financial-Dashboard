<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Redrawn from the icons8 "wallet liquid glass" PNG the artwork was chosen
    from. That download only went up to 96px, and a macOS icon needs 1024 — a
    10x upscale came out visibly soft, so this is the same design as vector and
    stays sharp at every size in the set.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0.15" x2="1" y2="0.9">
      <stop offset="0%"   stop-color="#ef7f27"/>
      <stop offset="45%"  stop-color="#f28f3c"/>
      <stop offset="100%" stop-color="#f6a45c"/>
    </linearGradient>
    <linearGradient id="card" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%"   stop-color="#f6bd91"/>
      <stop offset="100%" stop-color="#fbd8bd"/>
    </linearGradient>
    <linearGradient id="clasp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fbd5b6"/>
      <stop offset="100%" stop-color="#f7c49c"/>
    </linearGradient>
  </defs>

  <!-- The card tucked behind, leaning out of the top-right. -->
  <g transform="rotate(-14 512 512)">
    <rect x="236" y="150" width="604" height="300" rx="62" ry="62" fill="url(#card)"/>
  </g>

  <!-- Wallet body. -->
  <rect x="96" y="252" width="820" height="608" rx="104" ry="104" fill="url(#body)"/>

  <!-- Clasp: a pill that starts inside the body and runs past its right edge. -->
  <rect x="636" y="440" width="368" height="232" rx="102" ry="102" fill="url(#clasp)"/>
  <circle cx="757" cy="556" r="52" fill="#f0913f"/>
</svg>
